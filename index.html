<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Davi Z</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:#0b63b6;
}

.screen{
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.screen.active{
    display:flex;
}


/* =========================
MENU
========================= */

#menu{
    position:relative;
    overflow:hidden;
    background:linear-gradient(
        #168fd4,
        #8edfff
    );
}

.cloud{
    position:absolute;
    width:180px;
    height:55px;
    background:white;
    border-radius:50px;
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:70px;
    height:70px;
    left:25px;
    bottom:10px;
}

.cloud:after{
    width:90px;
    height:90px;
    right:20px;
    bottom:5px;
}

.cloud1{
    top:15%;
    left:-40px;
}

.cloud2{
    bottom:15%;
    right:-40px;
}

h1{
    position:relative;
    z-index:2;

    color:white;
    font-size:70px;
    margin:0 0 40px 0;

    text-shadow:
        4px 5px 0 #07528f;
}

.menuButton{
    position:relative;
    z-index:10;

    width:280px;
    padding:18px;

    margin:8px;

    border:3px solid white;
    border-radius:15px;

    background:#0874c9;
    color:white;

    font-size:23px;
    font-weight:bold;

    cursor:pointer;
}


/* =========================
SELEÇÃO
========================= */

#selection{
    background:
        linear-gradient(
            #061a42,
            #063d78
        );

    color:white;
}

#selection h2{
    font-size:40px;
    margin-bottom:30px;
}

.characters{
    display:flex;
    gap:20px;
}

.character{
    width:190px;
    padding:20px;

    border:2px solid #55cfff;
    border-radius:15px;

    background:#092653;

    text-align:center;
}

.character h3{
    font-size:25px;
}

.character button{
    margin-top:15px;
    padding:10px 20px;

    border:0;
    border-radius:8px;

    background:#0da9ed;
    color:white;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
JOGO
========================= */

#game{
    background:#62c5ed;
    color:white;
    position:relative;
}

#game h2{
    font-size:50px;
}

.backButton{
    padding:15px 30px;

    background:#d32f2f;
    color:white;

    border:0;
    border-radius:10px;

    font-size:18px;

    cursor:pointer;
}

</style>
</head>

<body>


<!-- =========================
MENU
========================= -->

<div id="menu" class="screen active">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <h1>DAVI Z</h1>

    <button
        class="menuButton"
        onclick="openSelection('treino')">

        TREINO

    </button>

    <button
        class="menuButton"
        onclick="openSelection('infinito')">

        INFINITO

    </button>

    <button
        class="menuButton"
        onclick="openSelection('versus')">

        VERSUS

    </button>

</div>


<!-- =========================
SELEÇÃO
========================= -->

<div id="selection" class="screen">

    <h2>
        ESCOLHA SEU LUTADOR
    </h2>

    <div class="characters">

        <div class="character">

            <h3>Goku</h3>

            <p>
                HP: 90
            </p>

            <p>
                ATK: 1
            </p>

            <button
                onclick="startGame('Goku')">

                ESCOLHER

            </button>

        </div>


        <div class="character">

            <h3>Piccolo</h3>

            <p>
                HP: 110
            </p>

            <p>
                ATK: 1
            </p>

            <button
                onclick="startGame('Piccolo')">

                ESCOLHER

            </button>

        </div>


        <div class="character">

            <h3>Vegeta</h3>

            <p>
                HP: 85
            </p>

            <p>
                ATK: 1
            </p>

            <button
                onclick="startGame('Vegeta')">

                ESCOLHER

            </button>

        </div>

    </div>

</div>


<!-- =========================
JOGO
========================= -->

<div id="game" class="screen">

    <h2 id="gameTitle">
        DAVI Z
    </h2>

    <p id="gameInfo">
        Jogo iniciado!
    </p>

    <button
        class="backButton"
        onclick="goMenu()">

        VOLTAR AO MENU

    </button>

</div>


<script>

/*
========================================
SISTEMA DE NAVEGAÇÃO
========================================
*/

let currentMode = "";


/*
ABRIR SELEÇÃO
*/

function openSelection(mode){

    currentMode = mode;

    document
        .getElementById("menu")
        .classList
        .remove("active");

    document
        .getElementById("selection")
        .classList
        .add("active");

}


/*
INICIAR JOGO
*/

function startGame(character){

    document
        .getElementById("selection")
        .classList
        .remove("active");

    document
        .getElementById("game")
        .classList
        .add("active");

    document
        .getElementById("gameTitle")
        .textContent =
        character;

    document
        .getElementById("gameInfo")
        .textContent =
        "Modo: " +
        currentMode +
        " | Lutador: " +
        character;

}


/*
VOLTAR AO MENU
*/

function goMenu(){

    document
        .getElementById("game")
        .classList
        .remove("active");

    document
        .getElementById("menu")
        .classList
        .add("active");

}

</script>

</body>
</html>
