<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Davi Z</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         MENU
    ========================== -->

    <section
        id="menu"
        class="screen active"
    >

        <h1>DAVI Z</h1>

        <button
            id="versusButton"
            class="main-button"
        >
            VERSUS
        </button>

    </section>



    <!-- =========================
         ESCOLHA DO JOGADOR
    ========================== -->

    <section
        id="playerSelection"
        class="screen"
    >

        <h2>
            ESCOLHA SEU PERSONAGEM
        </h2>

        <div class="characters">

            <button
                class="character-button"
                data-character="Goku"
            >
                GOKU
            </button>

            <button
                class="character-button"
                data-character="Piccolo"
            >
                PICCOLO
            </button>

            <button
                class="character-button"
                data-character="Vegeta"
            >
                VEGETA
            </button>

        </div>

    </section>



    <!-- =========================
         ESCOLHA DO OPONENTE
    ========================== -->

    <section
        id="enemySelection"
        class="screen"
    >

        <h2>
            ESCOLHA O OPONENTE
        </h2>

        <div class="characters">

            <button
                class="enemy-button"
                data-character="Goku"
            >
                GOKU
            </button>

            <button
                class="enemy-button"
                data-character="Piccolo"
            >
                PICCOLO
            </button>

            <button
                class="enemy-button"
                data-character="Vegeta"
            >
                VEGETA
            </button>

        </div>

    </section>



    <!-- =========================
         BATALHA
    ========================== -->

    <section
        id="battle"
        class="screen"
    >

        <div id="arena">


            <!-- =====================
                 HUD DO JOGADOR
            ====================== -->

            <div
                id="playerHud"
                class="hud"
            >

                <div id="playerName">
                    GOKU
                </div>

                <div class="bar">

                    <div
                        id="playerHpBar"
                        class="hp"
                    ></div>

                </div>

                <div class="bar">

                    <div
                        id="playerEnergyBar"
                        class="energy"
                    ></div>

                </div>

                <div>

                    HP:
                    <span id="playerHp">
                        90
                    </span>

                </div>

                <div>

                    ENERGIA:
                    <span id="playerEnergy">
                        100
                    </span>

                </div>

                <div>

                    ATK:
                    <span id="playerAtk">
                        1
                    </span>

                </div>

            </div>



            <!-- =====================
                 HUD DO INIMIGO
            ====================== -->

            <div
                id="enemyHud"
                class="hud"
            >

                <div id="enemyName">
                    VEGETA
                </div>

                <div class="bar">

                    <div
                        id="enemyHpBar"
                        class="hp"
                    ></div>

                </div>

                <div>

                    HP:
                    <span id="enemyHp">
                        85
                    </span>

                </div>

                <div>

                    ATK:
                    <span id="enemyAtk">
                        1
                    </span>

                </div>

            </div>



            <!-- =====================
                 PERSONAGENS
            ====================== -->

            <div
                id="playerCharacter"
                class="fighter"
            ></div>

            <div
                id="enemyCharacter"
                class="fighter"
            ></div>



            <!-- =====================
                 TRANSFORMAÇÕES
            ====================== -->

            <div id="transformations">

                <button
                    class="transform-button"
                    id="ssjButton"
                >
                    SSJ
                </button>

                <button
                    class="transform-button"
                    id="godButton"
                >
                    SSJ GOD
                </button>

                <button
                    class="transform-button"
                    id="blueButton"
                >
                    SSJ BLUE
                </button>

                <button
                    class="transform-button"
                    id="uiButton"
                >
                    INSTINTO
                </button>

            </div>



            <!-- =====================
                 SKILLS
            ====================== -->

            <div id="skills">

                <button
                    class="skill-button"
                    id="skill1"
                >
                    SKILL 1
                </button>

                <button
                    class="skill-button"
                    id="skill2"
                >
                    SKILL 2
                </button>

                <button
                    class="skill-button"
                    id="skill3"
                >
                    SKILL 3
                </button>

            </div>



            <!-- =====================
                 CONTROLES
            ====================== -->

            <div id="controls">


                <!-- ANALÓGICO -->

                <div id="joystick">

                    <div id="stick"></div>

                </div>



                <!-- PULO -->

                <button
                    id="jumpButton"
                    class="control-button"
                >
                    PULO
                </button>



                <!-- ATAQUE -->

                <button
                    id="attackButton"
                    class="control-button"
                >
                    ATAQUE
                </button>



                <!-- DASH -->

                <button
                    id="dashButton"
                    class="control-button"
                >
                    DASH
                </button>



                <!-- KI -->

                <button
                    id="kiButton"
                    class="control-button"
                >
                    KI
                </button>


            </div>



            <!-- MENSAGEM DE VITÓRIA -->

            <div
                id="battleMessage"
            ></div>


        </div>

    </section>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        src="js/main.js"
    ></script>

    <script
        src="js/game.js"
    ></script>


</body>

</html>
