<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Davi Z</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MENU -->

    <section id="menu" class="screen active">

        <h1>DAVI Z</h1>

        <button id="versusButton" class="main-button">
            VERSUS
        </button>

    </section>


    <!-- ESCOLHA DO JOGADOR -->

    <section id="playerSelection" class="screen">

        <h2>ESCOLHA SEU PERSONAGEM</h2>

        <div class="characters">

            <button class="character-button" data-character="Goku">
                GOKU
            </button>

            <button class="character-button" data-character="Piccolo">
                PICCOLO
            </button>

            <button class="character-button" data-character="Vegeta">
                VEGETA
            </button>

        </div>

    </section>


    <!-- ESCOLHA DO RIVAL -->

    <section id="enemySelection" class="screen">

        <h2>ESCOLHA O RIVAL</h2>

        <div class="characters">

            <button class="enemy-button" data-character="Goku">
                GOKU
            </button>

            <button class="enemy-button" data-character="Piccolo">
                PICCOLO
            </button>

            <button class="enemy-button" data-character="Vegeta">
                VEGETA
            </button>

        </div>

    </section>


    <!-- BATALHA -->

    <section id="battle" class="screen">

        <div id="arena">

            <div id="battleInfo">

                <h2>PARTIDA INICIADA</h2>

                <p>

                    <span id="battlePlayer">
                        -
                    </span>

                    VS

                    <span id="battleEnemy">
                        -
                    </span>

                </p>

            </div>

        </div>

    </section>


    <!-- JAVASCRIPT -->

    <script src="js/main.js"></script>

</body>

</html>
