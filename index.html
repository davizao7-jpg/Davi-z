<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Davi Z</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================
         MENU PRINCIPAL
    ========================== -->

    <section
        id="menu"
        class="screen active"
    >

        <h1>DAVI Z</h1>

        <button
            id="versusButton"
            class="main-button"
        >
            VERSUS
        </button>

    </section>


    <!-- =========================
         SELEÇÃO DO JOGADOR
    ========================== -->

    <section
        id="playerSelection"
        class="screen"
    >

        <h2>ESCOLHA SEU PERSONAGEM</h2>

        <div class="characters">

            <button
                class="character-button"
                data-character="Goku"
            >
                GOKU
            </button>

            <button
                class="character-button"
                data-character="Piccolo"
            >
                PICCOLO
            </button>

            <button
                class="character-button"
                data-character="Vegeta"
            >
                VEGETA
            </button>

        </div>

    </section>


    <!-- =========================
         SELEÇÃO DO OPONENTE
    ========================== -->

    <section
        id="enemySelection"
        class="screen"
    >

        <h2>ESCOLHA O OPONENTE</h2>

        <div class="characters">

            <button
                class="enemy-button"
                data-character="Goku"
            >
                LUTAR CONTRA GOKU
            </button>

            <button
                class="enemy-button"
                data-character="Piccolo"
            >
                LUTAR CONTRA PICCOLO
            </button>

            <button
                class="enemy-button"
                data-character="Vegeta"
            >
                LUTAR CONTRA VEGETA
            </button>

        </div>

    </section>


    <!-- =========================
         ARENA
    ========================== -->

    <section
        id="battle"
        class="screen"
    >

        <div id="arena">

            <div id="playerCharacter">
                <span id="playerName"></span>
            </div>

            <div id="enemyCharacter">
                <span id="enemyName"></span>
            </div>

            <div id="battleInfo">

                <h2>
                    PARTIDA INICIADA
                </h2>

                <p>
                    <span id="battlePlayer"></span>
                    VS
                    <span id="battleEnemy"></span>
                </p>

            </div>

        </div>

    </section>


    <script
        src="js/main.js"
    ></script>

</body>

</html>
