<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Davi Z</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#07152d;
}

button{
    font-family:Arial,sans-serif;
    touch-action:none;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* MENU */

#menu{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(#1597da,#9ae8ff);
}

.cloud{
    position:absolute;
    width:180px;
    height:50px;
    background:white;
    border-radius:50px;
    opacity:.8;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:70px;
    height:70px;
    left:25px;
    bottom:5px;
}

.cloud:after{
    width:85px;
    height:85px;
    right:20px;
    bottom:0;
}

.cloud1{
    left:-40px;
    top:15%;
}

.cloud2{
    right:-40px;
    bottom:15%;
}

#menu h1{
    z-index:2;
    color:white;
    font-size:65px;
    margin:0 0 35px;
    text-shadow:4px 5px 0 #07528f;
}

.menuButton{
    z-index:5;
    width:280px;
    padding:17px;
    margin:7px;
    border:3px solid white;
    border-radius:14px;
    background:#0874c9;
    color:white;
    font-size:22px;
    font-weight:bold;
}

/* SELEÇÃO */

#selection{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:linear-gradient(#061a42,#07518a);
    color:white;
}

#selection h2{
    margin:0 0 25px;
    font-size:36px;
}

.characters{
    display:flex;
    gap:20px;
}

.character{
    width:190px;
    padding:18px;
    text-align:center;
    background:#092653;
    border:2px solid #54cfff;
    border-radius:15px;
}

.character h3{
    font-size:25px;
    margin:5px 0 15px;
}

.character p{
    margin:7px;
}

.character button{
    margin-top:10px;
    padding:10px 20px;
    border:0;
    border-radius:8px;
    background:#0da9ed;
    color:white;
    font-weight:bold;
}

/* JOGO */

#game{
    background:#111;
    align-items:center;
    justify-content:center;
}

#gameWorld{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
        linear-gradient(
            #42b8ee 0%,
            #aeeaff 62%,
            #4d9d43 63%,
            #28652c 100%
        );
}

/* CENÁRIO */

.gameCloud{
    position:absolute;
    width:160px;
    height:45px;
    background:rgba(255,255,255,.75);
    border-radius:50px;
}

.gameCloud.c1{
    left:10%;
    top:15%;
}

.gameCloud.c2{
    right:15%;
    top:22%;
}

/* HUD */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    width:260px;
    z-index:20;
    color:white;
    text-shadow:2px 2px 3px black;
    font-weight:bold;
}

#enemyHud{
    position:absolute;
    top:15px;
    right:15px;
    width:260px;
    z-index:20;
    color:white;
    text-align:right;
    text-shadow:2px 2px 3px black;
    font-weight:bold;
}

.bar{
    height:18px;
    margin:4px 0;
    border:2px solid white;
    border-radius:10px;
    background:#111;
    overflow:hidden;
}

#hpFill{
    width:100%;
    height:100%;
    background:#e52222;
}

#energyFill{
    width:100%;
    height:100%;
    background:#1598ff;
}

#enemyHpFill{
    width:100%;
    height:100%;
    background:#e52222;
}

.stats{
    font-size:14px;
    line-height:20px;
}

/* PERSONAGENS */

.fighter{
    position:absolute;
    width:48px;
    height:82px;
    bottom:110px;
    border-radius:22px 22px 8px 8px;
    z-index:10;
}

.fighter:before{
    content:"";
    position:absolute;
    width:48px;
    height:48px;
    top:-38px;
    left:0;
    border-radius:50%;
    background:inherit;
}

#player{
    left:25%;
    background:#f08b20;
    box-shadow:0 0 18px #ffb300;
}

#enemy{
    left:70%;
    background:#c82d38;
    box-shadow:0 0 18px #ff3333;
}

/* ATAQUE */

.punchEffect{
    position:absolute;
    width:65px;
    height:13px;
    background:#fff35a;
    border-radius:10px;
    box-shadow:0 0 20px #fff000;
    z-index:9;
}

.kiEffect{
    position:absolute;
    width:180px;
    height:16px;
    background:#28dfff;
    border-radius:20px;
    box-shadow:0 0 25px #00d9ff,0 0 45px white;
    z-index:9;
}

/* CONTROLES */

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:115px;
    height:115px;
    border-radius:50%;
    background:rgba(0,0,0,.3);
    border:3px solid rgba(255,255,255,.7);
    z-index:30;
    touch-action:none;
}

#stick{
    position:absolute;
    width:48px;
    height:48px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.8);
}

.control{
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    border:3px solid white;
    color:white;
    font-weight:bold;
    z-index:30;
}

#jump{
    left:160px;
    bottom:30px;
    background:#319b38;
}

#attack{
    right:25px;
    bottom:30px;
    background:#dc381b;
}

#dash{
    right:115px;
    bottom:105px;
    background:#4d4db8;
}

#ki{
    right:25px;
    bottom:120px;
    background:#087dcc;
}

/* SKILLS */

#skills{
    position:absolute;
    right:20px;
    bottom:200px;
    display:flex;
    gap:7px;
    z-index:30;
}

.skill{
    padding:9px 12px;
    background:rgba(0,0,0,.7);
    color:white;
    border:2px solid white;
    border-radius:8px;
    font-weight:bold;
}

/* TRANSFORMAÇÕES */

#transformations{
    position:absolute;
    left:15px;
    top:155px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:30;
}

.transform{
    padding:8px 12px;
    background:rgba(0,0,0,.7);
    color:white;
    border:2px solid #ffd83d;
    border-radius:8px;
    font-weight:bold;
}

/* MENSAGEM */

#message{
    display:none;
    position:absolute;
    z-index:100;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:45px;
    font-weight:bold;
    text-align:center;
    text-shadow:4px 4px 8px black;
}

#backGame{
    position:absolute;
    right:15px;
    top:100px;
    z-index:40;
    padding:8px 14px;
    background:#a71919;
    color:white;
    border:2px solid white;
    border-radius:8px;
}

@media(max-width:700px){

    #hud,
    #enemyHud{
        width:180px;
        font-size:12px;
    }

    #selection h2{
        font-size:25px;
    }

    .characters{
        gap:5px;
    }

    .character{
        width:30vw;
        padding:10px;
    }

    .character h3{
        font-size:18px;
    }

    .character p{
        font-size:11px;
    }

    .character button{
        font-size:10px;
        padding:8px;
    }

    #joystick{
        width:85px;
        height:85px;
    }

    #stick{
        width:36px;
        height:36px;
    }

    .control{
        width:58px;
        height:58px;
        font-size:10px;
    }

    #jump{
        left:125px;
    }

    #attack{
        right:20px;
    }

    #dash{
        right:90px;
    }

    #ki{
        right:20px;
        bottom:105px;
    }

    #skills{
        right:15px;
        bottom:175px;
    }

    #transformations{
        top:125px;
    }
}
</style>
</head>

<body>

<!-- MENU -->

<div id="menu" class="screen active">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <h1>DAVI Z</h1>

    <button class="menuButton" onclick="openMode('treino')">
        TREINO
    </button>

    <button class="menuButton" onclick="openMode('infinito')">
        INFINITO
    </button>

    <button class="menuButton" onclick="openMode('versus')">
        VERSUS
    </button>

</div>


<!-- SELEÇÃO -->

<div id="selection" class="screen">

    <h2>ESCOLHA SEU LUTADOR</h2>

    <div class="characters">

        <div class="character">
            <h3>GOKU</h3>
            <p>HP: 90</p>
            <p>ATK: 1</p>
            <p>ENERGIA: 100</p>
            <button onclick="selectCharacter('Goku')">
                ESCOLHER
            </button>
        </div>

        <div class="character">
            <h3>PICCOLO</h3>
            <p>HP: 110</p>
            <p>ATK: 1</p>
            <p>ENERGIA: 100</p>
            <button onclick="selectCharacter('Piccolo')">
                ESCOLHER
            </button>
        </div>

        <div class="character">
            <h3>VEGETA</h3>
            <p>HP: 85</p>
            <p>ATK: 1</p>
            <p>ENERGIA: 100</p>
            <button onclick="selectCharacter('Vegeta')">
                ESCOLHER
            </button>
        </div>

    </div>

</div>


<!-- JOGO -->

<div id="game" class="screen">

    <div id="gameWorld">

        <div class="gameCloud c1"></div>
        <div class="gameCloud c2"></div>

        <!-- HUD DO JOGADOR -->

        <div id="hud">

            <div id="playerName">GOKU</div>

            <div class="bar">
                <div id="hpFill"></div>
            </div>

            <div class="bar">
                <div id="energyFill"></div>
            </div>

            <div class="stats">
                HP:
                <span id="hpText">90 / 90</span>
                <br>

                ENERGIA:
                <span id="energyText">100 / 100</span>
                <br>

                ATK:
                <span id="atkText">1</span>
                <br>

                DEFESA:
                <span id="defenseText">100%</span>
                <br>

                💰 MOEDAS:
                <span id="coinsText">∞</span>
            </div>

        </div>


        <!-- HUD DO INIMIGO -->

        <div id="enemyHud">

            <div>INIMIGO</div>

            <div class="bar">
                <div id="enemyHpFill"></div>
            </div>

            <div class="stats">
                HP:
                <span id="enemyHpText">20 / 20</span>
                <br>

                ATK:
                <span id="enemyAtkText">1</span>
            </div>

        </div>


        <!-- TRANSFORMAÇÕES -->

        <div id="transformations">

            <button class="transform">SSJ</button>
            <button class="transform">SSJ GOD</button>
            <button class="transform">SSJ BLUE</button>
            <button class="transform">INSTINTO</button>

        </div>


        <!-- PERSONAGENS -->

        <div id="player" class="fighter"></div>

        <div id="enemy" class="fighter"></div>


        <!-- SKILLS -->

        <div id="skills">

            <button class="skill">SKILL 1</button>
            <button class="skill">SKILL 2</button>
            <button class="skill">SKILL 3</button>

        </div>


        <!-- CONTROLES -->

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button id="jump" class="control">
            PULO
        </button>

        <button id="attack" class="control">
            SOCO
        </button>

        <button id="dash" class="control">
            DASH
        </button>

        <button id="ki" class="control">
            KI
        </button>


        <button id="backGame" onclick="backToMenu()">
            MENU
        </button>


        <div id="message"></div>

    </div>

</div>


<script>

/* =========================
   DADOS
========================= */

const characters = {

    Goku:{
        hp:90,
        atk:1,
        color:"#f08b20"
    },

    Piccolo:{
        hp:110,
        atk:1,
        color:"#2db84d"
    },

    Vegeta:{
        hp:85,
        atk:1,
        color:"#2867d5"
    }

};

let mode="treino";
let selectedCharacter="Goku";

let player;
let enemy;

let running=false;

let keys={};

let joystickX=0;
let joystickY=0;
let joystickActive=false;


/* =========================
   TELAS
========================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================
   MODO
========================= */

function openMode(selectedMode){

    mode=selectedMode;

    showScreen("selection");

}


/* =========================
   ESCOLHER PERSONAGEM
========================= */

function selectCharacter(name){

    selectedCharacter=name;

    startGame();

}


/* =========================
   COMEÇAR JOGO
========================= */

function startGame(){

    const data=characters[selectedCharacter];

    player={

        name:selectedCharacter,

        maxHp:data.hp,
        hp:data.hp,

        atk:data.atk,

        maxEnergy:100,
        energy:100,

        defense:100,

        x:250,
        y:0,

        velocityY:0,

        grounded:true,

        facing:1,

        speed:4,

        attackCooldown:0,
        dashCooldown:0

    };


    enemy={

        maxHp:20,
        hp:20,

        atk:1,

        x:850,
        y:0,

        attackCooldown:0

    };


    document
        .getElementById("player")
        .style.background=
        data.color;


    showScreen("game");

    updateHUD();

    updateEnemyHUD();

    placeFighters();

    running=true;

    requestAnimationFrame(loop);

}


/* =========================
   DEFESA
========================= */

function calculateDefense(){

    let percentage=
        player.energy/
        player.maxEnergy;

    if(percentage<0.30){

        player.defense=0;

    }else if(percentage<0.50){

        player.defense=60;

    }else if(percentage<0.70){

        player.defense=80;

    }else{

        player.defense=100;

    }

}


/* =========================
   ENERGIA
========================= */

function spendEnergy(amount){

    if(player.energy<amount){
        return false;
    }

    player.energy-=amount;

    calculateDefense();

    updateHUD();

    return true;

}


/* =========================
   SOCO
========================= */

function attack(){

    if(!running)return;

    if(player.attackCooldown>0)return;

    if(!spendEnergy(1))return;

    player.attackCooldown=25;

    const distance=
        Math.abs(player.x-enemy.x);

    createPunch();

    if(distance<120){

        damageEnemy(player.atk);

    }

}


/* =========================
   KI
========================= */

function kiAttack(){

    if(!running)return;

    if(player.attackCooldown>0)return;

    if(!spendEnergy(2))return;

    player.attackCooldown=35;

    createKi();

    const distance=
        Math.abs(player.x-enemy.x);

    if(distance<380){

        damageEnemy(player.atk);

    }

}


/* =========================
   DASH
========================= */

function dash(){

    if(!running)return;

    if(player.dashCooldown>0)return;

    if(!spendEnergy(2))return;

    player.dashCooldown=20;

    player.x+=
        player.facing*130;

    player.invulnerable=true;

    setTimeout(()=>{
        player.invulnerable=false;
    },300);

}


/* =========================
   PULO
========================= */

function jump(){

    if(!running)return;

    if(!player.grounded)return;

    player.grounded=false;

    player.velocityY=-12;

}


/* =========================
   DANO
========================= */

function damageEnemy(amount){

    enemy.hp-=amount;

    if(enemy.hp<0){
        enemy.hp=0;
    }

    updateEnemyHUD();

    if(enemy.hp<=0){

        running=false;

        showMessage("VITÓRIA!");

    }

}


/* =========================
   INIMIGO
========================= */

function updateEnemy(){

    if(!running)return;

    const distance=
        player.x-enemy.x;

    if(Math.abs(distance)>90){

        enemy.x+=
            Math.sign(distance)*1.1;

    }else{

        enemyAttack();

    }

    if(enemy.attackCooldown>0){

        enemy.attackCooldown--;

    }

}


/* =========================
   ATAQUE INIMIGO
========================= */

function enemyAttack(){

    if(enemy.attackCooldown>0)return;

    enemy.attackCooldown=60;

    if(player.invulnerable)return;

    let damage=
        enemy.atk*
        (1-player.defense/100);

    if(damage<0.2){
        damage=0.2;
    }

    player.hp-=damage;

    if(player.hp<0){
        player.hp=0;
    }

    updateHUD();

    if(player.hp<=0){

        running=false;

        showMessage("DERROTA!");

    }

}


/* =========================
   MOVIMENTO
========================= */

function updatePlayer(){

    let movement=joystickX;

    if(keys["a"]||keys["arrowleft"]){
        movement=-1;
    }

    if(keys["d"]||keys["arrowright"]){
        movement=1;
    }

    if(Math.abs(movement)>0.1){

        player.x+=
            movement*player.speed;

        player.facing=
            movement>0?1:-1;

    }


    /* gravidade */

    if(!player.grounded){

        player.velocityY+=0.6;

        player.y+=
            player.velocityY;

        if(player.y<=0){

            player.y=0;

            player.velocityY=0;

            player.grounded=true;

        }

    }


    /* limites */

    if(player.x<40){
        player.x=40;
    }

    if(player.x>1300){
        player.x=1300;
    }


    if(player.attackCooldown>0){
        player.attackCooldown--;
    }

    if(player.dashCooldown>0){
        player.dashCooldown--;
    }

}


/* =========================
   REGENERAÇÃO
========================= */

function regenerateEnergy(){

    if(!running)return;

    player.energy+=2/60;

    if(player.energy>100){
        player.energy=100;
    }

    calculateDefense();

}


/* =========================
   POSIÇÃO
========================= */

function placeFighters(){

    const playerElement=
        document.getElementById("player");

    const enemyElement=
        document.getElementById("enemy");


    playerElement.style.left=
        player.x+"px";

    playerElement.style.bottom=
        (110+player.y)+"px";


    enemyElement.style.left=
        enemy.x+"px";

    enemyElement.style.bottom=
        (110+enemy.y)+"px";

}


/* =========================
   HUD
========================= */

function updateHUD(){

    const hpPercent=
        player.hp/
        player.maxHp*
        100;

    const energyPercent=
        player.energy/
        player.maxEnergy*
        100;


    document.getElementById("playerName")
        .textContent=
        player.name;


    document.getElementById("hpFill")
        .style.width=
        hpPercent+"%";


    document.getElementById("energyFill")
        .style.width=
        energyPercent+"%";


    document.getElementById("hpText")
        .textContent=
        Math.ceil(player.hp)+
        " / "+
        player.maxHp;


    document.getElementById("energyText")
        .textContent=
        Math.floor(player.energy)+
        " / 100";


    document.getElementById("atkText")
        .textContent=
        player.atk;


    document.getElementById("defenseText")
        .textContent=
        player.defense+"%";

}


/* =========================
   HUD INIMIGO
========================= */

function updateEnemyHUD(){

    const percentage=
        enemy.hp/
        enemy.maxHp*
        100;

    document.getElementById("enemyHpFill")
        .style.width=
        percentage+"%";

    document.getElementById("enemyHpText")
        .textContent=
        Math.ceil(enemy.hp)+
        " / "+
        enemy.maxHp;

    document.getElementById("enemyAtkText")
        .textContent=
        enemy.atk;

}


/* =========================
   EFEITO SOCO
========================= */

function createPunch(){

    const effect=
        document.createElement("div");

    effect.className="punchEffect";

    effect.style.left=
        (player.x+
        player.facing*45)+"px";

    effect.style.bottom=
        (145+player.y)+"px";

    if(player.facing<0){
        effect.style.transform=
            "scaleX(-1)";
    }

    document
